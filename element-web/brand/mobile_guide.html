<!doctype html>
<!--
  2ecure: replaces Element Web's mobile guide (/mobile_guide/), where Element Web sends iPhone and Android browsers
  that open chat.2ecure.com without a room link. Element's page only offers Element's own apps. Copied by brand.sh
  (init container «brand»), mounted by deploy/ess/values/60-elementweb.yaml. German, English for other languages.
  «Im Browser weiter» sets the same flag as Element's «desktop site» link, so the web app opens without redirecting.
  The app buttons are the provisioning links of the MAS account pages (deploy/ess/mas/templates/components/2ecure_app.html).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2ecure auf dem Smartphone</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../vector-icons/180.png">
<style>
  :root { color-scheme: light dark; --fg: #1b1d22; --muted: #656d77; --bg: #ffffff; --line: #e1e6ec; --btn: #1b1d22; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ebeef2; --muted: #a9b2bc; --bg: #101317; --line: #2b3138; --btn: #ebeef2; --btn-fg: #101317; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 30rem; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }
  header { text-align: center; margin-bottom: 2rem; }
  header img { width: 72px; height: 72px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 1rem 0 0; }
  .lead { color: var(--muted); margin: 0 0 2rem; }
  .actions { display: grid; gap: .75rem; margin: 0 0 2rem; }
  .button { display: block; text-align: center; text-decoration: none; font-weight: 600; padding: .9rem 1rem; border-radius: 999px; border: 2px solid var(--btn); }
  .primary { background: var(--btn); color: var(--btn-fg); }
  .secondary { color: var(--fg); background: transparent; }
  .more { border-top: 1px solid var(--line); padding-top: 1.25rem; color: var(--muted); font-size: .95rem; }
  .more a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <header>
    <img src="../vector-icons/180.png" alt="2ecure">
    <h1 id="title">2ecure auf dem Smartphone</h1>
  </header>
  <p class="lead" id="lead">Auf dem Smartphone nutzt du 2ecure am besten in der App: mit Mitteilungen und Anrufen. Die Web-App ist für Computer gemacht, im Browser geht es aber auch.</p>
  <div class="actions">
    <a class="button primary" id="open_app" href="https://2ecure.com/apps/">2ecure-App öffnen</a>
    <a class="button secondary" id="continue" href="../">Im Browser weiter</a>
  </div>
  <p class="more" id="more">Noch keine App? <a id="install" href="https://2ecure.com/apps/">Anleitung und Downloads</a></p>
</main>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var de = /^de\b/i.test(navigator.language || "de");
  var site = "https://2ecure.com" + (de ? "" : "/en");
  var q = "account_provider=2ecure.com";
  var open = document.getElementById("open_app"), install = document.getElementById("install");
  if (ios) {
    open.href = "https://2ecure.com/ios/?" + q; // universal link; without the app, the website's install hints
    install.href = site + "/apps/ios/";
  } else if (android) {
    open.href = "intent://2ecure.com/android/?" + q + "#Intent;scheme=https;package=com.twoecure.messenger;S.browser_fallback_url="
      + encodeURIComponent("https://2ecure.com/android/?" + q) + ";end";
    install.href = site + "/apps/android/";
  } else {
    open.href = install.href = site + "/apps/";
  }
  document.getElementById("continue").addEventListener("click", function (e) {
    e.preventDefault();
    try { sessionStorage.setItem("skip_mobile_redirect", "true"); } catch (err) {}
    window.location.href = "../";
  });
  if (!de) {
    document.documentElement.lang = "en";
    document.title = "2ecure on your phone";
    document.getElementById("title").textContent = "2ecure on your phone";
    document.getElementById("lead").textContent = "On your phone, 2ecure works best in the app: with notifications and calls. The web app is made for computers, but it also works in the browser.";
    open.textContent = "Open the 2ecure app";
    document.getElementById("continue").textContent = "Continue in the browser";
    document.getElementById("more").firstChild.nodeValue = "No app yet? ";
    install.textContent = "Instructions and downloads";
  }
})();
</script>
</body>
</html>
